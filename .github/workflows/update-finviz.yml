name: Update Finviz Breadth

on:
  workflow_dispatch:
  schedule:
    # Run at 9:30 AM Amman time on weekdays. GitHub may start scheduled jobs
    # late, so the workflow must not reject a delayed run after it starts.
    - cron: "30 9 * * 1-5"
      timezone: "Asia/Amman"

permissions:
  contents: write

concurrency:
  group: finviz-breadth-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Finviz breadth updater
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python finviz_breadth_updater.py

      - name: Commit updated breadth files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finviz_breadth.csv finviz_breadth.xlsx finviz_breadth_log.txt

          if git diff --cached --quiet; then
            echo "No breadth file changes to commit."
          else
            git commit -m "Update Finviz breadth data"

            for attempt in 1 2 3; do
              echo "Push attempt ${attempt}: synchronizing with origin/main."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not safely rebase the generated update onto origin/main."
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Updated breadth files pushed successfully."
                exit 0
              fi

              if [[ "${attempt}" -lt 3 ]]; then
                sleep $((attempt * 5))
              fi
            done

            echo "Push failed after three safe synchronization attempts."
            exit 1
          fi
